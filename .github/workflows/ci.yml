name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # 本番の ~/frontend にそのまま展開できる形にまとめる。
      - name: Package dist
        run: tar czf dist.tgz -C dist .

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            dist.tgz
            package.json
            package-lock.json
            serve.mjs
          if-no-files-found: error
          # build → deploy へ受け渡すだけなので、残す意味があるのは実行中の数分だけ。
          # 既定の90日で溜めると Free プランの artifact 容量(500MB)をすぐ超え、
          # アップロードが失敗してデプロイごと落ちる(2026-08-10 に発生、3.68GB まで肥大)。
          # ロールバックは VPS 上の dist.old / serve.mjs.prev で行うので artifact は要らない。
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    # main への push のときだけデプロイする(PR では走らせない)。
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 同時デプロイで dist の差し替えが競合しないよう直列化する。
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifact

      # さくらのVPSはSSHを常時開けたままにできる(EC2のような/32一時開放の仕組みは不要)。
      # 鍵認証のみ・パスワード認証は無効化済み。
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key artifact/dist.tgz "ubuntu@$VPS_HOST:/tmp/fe-dist.tgz"
          scp -i ~/.ssh/deploy_key artifact/serve.mjs artifact/package.json artifact/package-lock.json \
            "ubuntu@$VPS_HOST:/tmp/"

      - name: Deploy and health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "ubuntu@$VPS_HOST" 'bash -eu -o pipefail -s' <<'REMOTE'
            cd ~/frontend

            # ロールバック用に現行を退避してから差し替える。
            rm -rf dist.old
            mv dist dist.old
            mkdir dist
            tar xzf /tmp/fe-dist.tgz -C dist
            cp serve.mjs serve.mjs.prev
            cp /tmp/serve.mjs serve.mjs

            # VPS はメモリに余裕があるので、EC2時代のような node_modules 転送はせず
            # 依存が変わっていてもいなくても VPS 上で npm ci する(数秒で終わる)。
            cp package.json package-lock.json.prev-lock 2>/dev/null || true
            cp /tmp/package.json /tmp/package-lock.json .
            npm ci --omit=dev --no-audit --no-fund

            sudo systemctl restart shuttlematch-frontend

            # 起動完了まで待つ。
            for i in $(seq 1 24); do
              if curl -sf -o /dev/null http://localhost:3000/; then
                echo "health OK"
                systemctl is-active shuttlematch-frontend
                rm -f /tmp/fe-dist.tgz /tmp/serve.mjs /tmp/package.json /tmp/package-lock.json
                exit 0
              fi
              sleep 5
            done

            # 起動しなかったら直前の状態に戻す。
            echo "::error::health check failed - rolling back"
            sudo systemctl stop shuttlematch-frontend
            rm -rf dist
            mv dist.old dist
            cp serve.mjs.prev serve.mjs
            sudo systemctl start shuttlematch-frontend
            sleep 10
            systemctl is-active shuttlematch-frontend || true
            exit 1
          REMOTE

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://s-match.net/)
          echo "https://s-match.net/ -> HTTP $code"
          test "$code" = "200"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
